services:
  - type: web
    name: chatbot-educativo
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PERSPECTIVE_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production